{% extends "base.html" %}{% block content %}<div class="wrap"><div class="card hero"><h2>📝 JNV Mock Test — {{lang}}</h2><p>10-question demo paper • Production version can use blueprint-configured paper size.</p></div><form method="post" action="/submit">{% for q in qs %}<div class="card"><h3>{{loop.index}}. {{q["question"]}}</h3><input type="hidden" name="qid" value="{{q['id']}}">{% for o in [q["a"],q["b"],q["c"],q["d"]] %}<label class="option"><input type="radio" name="q_{{q['id']}}" value="{{o}}"> {{o}}</label>{% endfor %}</div>{% endfor %}<button class="btn" type="submit">Submit Test ✅</button></form></div>{% endblock %}
