{% extends "base.html" %}{% block content %}<div class="wrap"><div class="card"><h2>Student Registration</h2>{% if error %}<p>{{error}}</p>{% endif %}<form method="post"><input class="input" name="name" placeholder="Student Name" required><input class="input" name="student_id" placeholder="Personal Student ID" required><input class="input" type="password" name="password" placeholder="Password" required><input class="input" name="parent_mobile" placeholder="Parent/Guardian Mobile" required><select name="language"><option>ગુજરાતી</option><option>English</option><option>हिन्दी</option></select><button class="btn">Register</button></form></div></div>{% endblock %}
